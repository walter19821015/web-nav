<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用条款 - 皮皮鲁工具大全</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.7; color: #333; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f8fafc; }
    .card { background: #fff; padding: 36px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-size: 24px; margin-bottom: 20px; color: #0f172a; }
    h2 { font-size: 18px; margin-top: 24px; color: #1e293b; }
    p { margin: 12px 0; color: #475569; font-size: 14px; }
    .back { display: inline-block; margin-bottom: 20px; color: #2563eb; text-decoration: none; font-size: 14px; }
  </style>
  <script src="https://res.zvo.cn/translate/translate.js"></script>
</head>
<body>
  <div class="card">
    <a href="/" class="back">← 返回首页</a>
    <h1>服务与使用条款</h1>
    <p>更新日期：2026年10月</p>
    <h2>1. 网站服务说明</h2>
    <p>皮皮鲁工具大全为用户免费提供常用效率工具、网络实用组件及开发者资源的导航指引服务。所有内容旨在提升日常工作与开发效率。</p>
    <h2>2. 用户行为规范</h2>
    <p>用户在使用本站及所推荐工具时，须遵守当地法律法规，不得利用相关工具从事侵犯他人权益、危害网络安全或传播违规内容的行为。</p>
    <h2>3. 免责声明</h2>
    <p>本站所收录工具均为第三方开源项目或网络开放资源，本站尽最大努力核验链接有效性，但不对第三方服务的稳定性、准确性及可能产生的数据损失承担直接或附带责任。</p>
  </div>
  <script>
  (function() {
    function initTranslate() {
      if (typeof translate === 'undefined') {
        setTimeout(initTranslate, 100);
        return;
      }
      translate.selectLanguageTag.show = false;
      translate.service.use('client.edge');
      translate.execute();

      if (document.getElementById('lang-dropdown-wrapper')) return;

      const wrapper = document.createElement('div');
      wrapper.id = 'lang-dropdown-wrapper';
      wrapper.style.cssText = 'position:fixed;top:18px;right:20px;z-index:9999;';
      wrapper.innerHTML = `
        <button id="langMenuBtn" style="display:flex;align-items:center;gap:4px;padding:6px 12px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border:1px solid rgba(229,231,235,0.8);border-radius:8px;font-size:13px;font-weight:600;color:#1f2937;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.08);">
          <span>🌐 语言</span>
          <span style="font-size:10px;opacity:0.7;">▼</span>
        </button>
        <div id="langMenu" style="display:none;position:absolute;right:0;top:100%;margin-top:6px;width:120px;background:#ffffff;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.12);border:1px solid #e5e7eb;overflow:hidden;z-index:10000;padding:4px 0;">
          <a href="javascript:translate.changeLanguage('chinese_simplified');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">简体中文</a>
          <a href="javascript:translate.changeLanguage('english');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">English</a>
          <a href="javascript:translate.changeLanguage('spanish');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">Español</a>
          <a href="javascript:translate.changeLanguage('arabic');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">العربية</a>
        </div>
      `;
      document.body.appendChild(wrapper);

      const btn = document.getElementById('langMenuBtn');
      const menu = document.getElementById('langMenu');
      btn.onclick = function(e) {
        e.stopPropagation();
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
      };
      document.addEventListener('click', function(e) {
        if (!wrapper.contains(e.target)) menu.style.display = 'none';
      });
      menu.onclick = function() {
        menu.style.display = 'none';
      };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTranslate);
    } else {
      initTranslate();
    }
  })();
</script>
</body>
</html>
