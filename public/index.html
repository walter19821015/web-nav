 <!-- 多语言切换组件与自动挂载脚本 -->
<script>
  (function() {
    function initTranslate() {
      if (typeof translate === 'undefined') {
        setTimeout(initTranslate, 100);
        return;
      }
      translate.selectLanguageTag.show = false;
      translate.service.use('client.edge');
      translate.execute();

      if (document.getElementById('lang-dropdown-wrapper')) return;

      const wrapper = document.createElement('div');
      wrapper.id = 'lang-dropdown-wrapper';
      wrapper.style.cssText = 'position:fixed;top:18px;right:155px;z-index:9999;';
      wrapper.innerHTML = `
        <button id="langMenuBtn" style="display:flex;align-items:center;gap:4px;padding:6px 12px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.4);border-radius:8px;font-size:13px;font-weight:600;color:#1f2937;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.08);">
          <span>🌐 语言</span>
          <span style="font-size:10px;opacity:0.7;">▼</span>
        </button>
        <div id="langMenu" style="display:none;position:absolute;right:0;top:100%;margin-top:6px;width:120px;background:#ffffff;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.12);border:1px solid #e5e7eb;overflow:hidden;z-index:10000;padding:4px 0;">
          <a href="javascript:translate.changeLanguage('chinese_simplified');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">简体中文</a>
          <a href="javascript:translate.changeLanguage('english');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">English</a>
          <a href="javascript:translate.changeLanguage('spanish');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">Español</a>
          <a href="javascript:translate.changeLanguage('arabic');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">العربية</a>
        </div>
      `;
      document.body.appendChild(wrapper);

      const btn = document.getElementById('langMenuBtn');
      const menu = document.getElementById('langMenu');
      btn.onclick = function(e) {
        e.stopPropagation();
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
      };
      document.addEventListener('click', function(e) {
        if (!wrapper.contains(e.target)) menu.style.display = 'none';
      });
      menu.onclick = function() {
        menu.style.display = 'none';
      };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTranslate);
    } else {
      initTranslate();
    }
  })();
</script>
  <script>
document.addEventListener('DOMContentLoaded', function () {
  // 1. 定位搜索框
  const searchInput = document.querySelector('input[placeholder*="搜索"]') || document.querySelector('input[type="text"]');
  if (!searchInput) return;

  // 2. 监听实时输入与回车
  searchInput.addEventListener('input', filterBookmarks);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      filterBookmarks();
    }
  });

  function filterBookmarks() {
    const val = searchInput.value.trim().toLowerCase();
    // 获取页面上所有的卡片或链接条目
    const cards = document.querySelectorAll('.card, .bookmark-item, .item, a[target="_blank"]');

    cards.forEach(card => {
      // 排除顶部导航栏和管理按钮自身
      if (card.closest('header') || card.closest('nav') || card.closest('.search-box')) return;

      const text = card.innerText.toLowerCase();
      const href = (card.getAttribute('href') || '').toLowerCase();

      // 如果卡片名称、描述或链接包含搜索词，则显示；否则隐藏
      if (val === '' || text.includes(val) || href.includes(val)) {
        card.style.display = '';
        if (card.parentElement && card.parentElement.classList.contains('col')) {
          card.parentElement.style.display = '';
        }
      } else {
        card.style.display = 'none';
        if (card.parentElement && card.parentElement.classList.contains('col')) {
          card.parentElement.style.display = 'none';
        }
      }
    });

    // 联动处理空分类区块（如果整个分类下卡片全隐藏了，把分类标题也隐藏）
    const sections = document.querySelectorAll('section, .category-section, .box');
    sections.forEach(sec => {
      const visibleCards = sec.querySelectorAll('.card:not([style*="display: none"]), .item:not([style*="display: none"])');
      if (sec.querySelector('.card, .item')) {
        sec.style.display = (visibleCards.length > 0 || val === '') ? '' : 'none';
      }
    });
  }
});
</script>
